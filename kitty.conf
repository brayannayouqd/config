# Kitty theme
# Add the theme at the top, any setting below the theme will be overriden
# include ~/github/dotfiles-latest/kitty/themes/themes/ChallengerDeep.conf
# include ~/github/dotfiles-latest/kitty/themes/themes/Catppuccin-Mocha.conf
include ~/github/dotfiles-latest/kitty/themes/themes/Linkarzu.conf
# include ~/github/dotfiles-latest/kitty/active-theme.conf

term xterm-kitty

font_size 13

modify_font cell_width 95%

modify_font cell_height 5px

scrollback_lines 10000

bash --login -c "source ~/.bashrc && rm -f /tmp/skitty-neobean-socket && export PATH=\"/opt/homebrew/bin:$PATH\" && export NEOVIM_MODE=skitty && ~/github/dotfiles-latest/yabai/positions/kitty-pos.sh && sleep 2 && NVIM_APPNAME=neobean nvim --listen /tmp/skitty-neobean-socket \"$HOME/github/skitty/supporters.md\""

editor nvim

background_opacity 0.7
background_blur 64

window_padding_width 0

cursor #ebfafa
cursor_text_color #0D1116

confirm_os_window_close 0

enable_audio_bell no

macos_option_as_alt right

cursor_shape beam

cursor_beam_thickness 1.5

cursor_underline_thickness 2.0

cursor_blink_interval -1

cursor_stop_blinking_after 15.0

cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2


# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
